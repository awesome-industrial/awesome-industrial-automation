# Generated by scripts/build.py from data/*.yml.
name: Suggest a resource
description: Propose a project, tool or resource. A bot turns the suggestion into a pull request.
title: 'Suggest: '
labels:
- suggestion
body:
- type: markdown
  attributes:
    value: Thanks! Please read the [contribution guidelines](https://github.com/awesome-industrial/awesome-industrial-automation/blob/main/contributing.md) first. One resource per issue.
- type: input
  id: name
  attributes:
    label: Name
    placeholder: pymodbus
  validations:
    required: true
- type: input
  id: url
  attributes:
    label: Link
    placeholder: https://github.com/owner/project
  validations:
    required: true
- type: input
  id: description
  attributes:
    label: Description
    description: 'One plain sentence: starts with a capital letter, ends with a period, under 160 characters, does not repeat the name, no marketing words.'
  validations:
    required: true
- type: dropdown
  id: section
  attributes:
    label: Section
    options:
    - Protocols and Connectivity / Modbus
    - Protocols and Connectivity / OPC UA
    - Protocols and Connectivity / MQTT and Sparkplug
    - Protocols and Connectivity / Siemens S7
    - Protocols and Connectivity / EtherNet/IP and CIP
    - Protocols and Connectivity / BACnet
    - Protocols and Connectivity / EtherCAT and PROFINET
    - Protocols and Connectivity / Power Grid Protocols
    - Protocols and Connectivity / Multi-protocol Libraries
    - Edge and Integration / Edge Platforms and Gateways
    - Edge and Integration / Message Brokers
    - Edge and Integration / Unified Namespace
    - Control and PLC Programming / PLC Runtimes and IDEs
    - Control and PLC Programming / IEC 61131-3 Tooling
    - Control and PLC Programming / Motion, CNC and Robotics
    - SCADA and HMI / SCADA and HMI
    - SCADA and HMI / Dashboards and Visualization
    - Manufacturing Operations / MES and Production
    - Manufacturing Operations / Maintenance
    - Manufacturing Operations / Quality
    - Industrial Data / Historians and Time Series Databases
    - Industrial Data / Information Models
    - Industrial Data / Digital Twins and Simulation
    - Industrial AI / Predictive Maintenance and Anomaly Detection
    - Industrial AI / AI Agents and LLMs for OT
    - Industrial AI / Datasets
    - Security / Security
    - Learning and Community / Standards
    - Learning and Community / Books
    - Learning and Community / Courses and Tutorials
    - Learning and Community / YouTube Channels
    - Learning and Community / Podcasts
    - Learning and Community / Communities
    - Learning and Community / Related Lists
  validations:
    required: true
- type: checkboxes
  id: commercial
  attributes:
    label: Commercial
    options:
    - label: Commercial product (not open source)
- type: textarea
  id: why
  attributes:
    label: Why it belongs
    description: Who uses it, and is it yours?
